services:
  - type: web
    name: kisan-telegram-bot
    runtime: python
    pythonVersion: 3.11

    buildCommand: pip install -r requirements.txt

    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /health

    envVars:
      - key: ENVIRONMENT
        value: production

      - key: USE_WEBHOOK
        value: "true"

      - key: WEBHOOK_URL
        sync: false

      - key: DATABASE_URL
        sync: false

      - key: TELEGRAM_BOT_TOKEN
        sync: false

      - key: MODEL_PATH
        value: models/crop_disease_model.h5

      - key: CLASS_NAMES_PATH
        value: models/class_names.json

      - key: CONFIDENCE_HIGH
        value: "0.85"

      - key: CONFIDENCE_LOW
        value: "0.60"

      - key: MAX_IMAGE_SIZE_MB
        value: "10"

      - key: LOG_LEVEL
        value: INFO
